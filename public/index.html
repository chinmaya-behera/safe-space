<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safe Space</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/auth/auth.css">
</head>
<body>
<div id="splash"><div class="sp-orb"><i></i><i></i><i></i><em>💙</em></div><div class="sp-t"><span style="animation-delay:.3s">Safe</span><span style="animation-delay:.6s">Space</span></div><div class="sp-s">You are not alone.</div></div>
<div id="login" class="show"><div id="auth-root"><p class="auth-loading" role="status">Connecting to Safe Space…</p></div></div>
<div class="app" inert aria-hidden="true">
<header><button id="so" type="button">Sign out</button><b>💙 Safe Space</b><span>Support tools for hard moments. Not a replacement for professional care.</span></header>
<p class="care" id="auth-status" role="status" hidden></p>
<div class="help">In danger right now? Call <a href="tel:112">112</a> · Free 24/7 support: <a href="tel:14416">Tele-MANAS 14416</a></div>
<main id="main"></main>
<div id="chat">
<div id="chat-root"></div>
</div>
<nav>
<button id="chatnav" aria-label="Open chat"><span>💬</span>Chatbot</button>
<button class="sosb" data-v="help"><span>🆘</span>Help Now</button>
<button data-v="cope"><span>🌿</span>Coping Library</button>
<button data-v="jour"><span>📓</span>Journal</button>
</nav>
</div>
<script src="/app.js" defer></script>
<script type="module" src="/auth/auth.js"></script>
</body>
</html>
